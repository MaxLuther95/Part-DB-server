name: Build release images

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        variant: [apache, frankenphp]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
          - variant: apache
            dockerfile: Dockerfile
            image: ghcr.io/maxluther95/part-db-server
          - variant: frankenphp
            dockerfile: Dockerfile-frankenphp
            image: ghcr.io/maxluther95/part-db-server-frankenphp
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check source and create isolated build context
        run: |
          python3 .github/privacy/check_source_privacy.py --ref HEAD
          mkdir "$RUNNER_TEMP/release-source"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/release-source"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ runner.temp }}/release-source
          file: ${{ runner.temp }}/release-source/${{ matrix.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.title=Part-DB with production extension
            org.opencontainers.image.licenses=AGPL-3.0-or-later
          outputs: type=image,name=${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=release-${{ matrix.variant }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.variant }}-${{ matrix.arch }}
      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.variant }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    strategy:
      matrix:
        include:
          - variant: apache
            image: ghcr.io/maxluther95/part-db-server
          - variant: frankenphp
            image: ghcr.io/maxluther95/part-db-server-frankenphp
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.variant }}-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse replacing an existing version
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_IMAGE: ${{ matrix.image }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: python3 .github/release/check_release.py --image-only
      - name: Publish version manifest
        env:
          RELEASE_IMAGE: ${{ matrix.image }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re, subprocess
          digests = sorted(p.name for p in (pathlib.Path(os.environ['RUNNER_TEMP']) / 'digests').iterdir())
          assert len(digests) == 2 and all(re.fullmatch('[0-9a-f]{64}', d) for d in digests)
          image = os.environ['RELEASE_IMAGE']
          tag = image + ':' + os.environ['RELEASE_VERSION']
          subprocess.run(['docker', 'buildx', 'imagetools', 'create', '--tag', tag,
                          *[image + '@sha256:' + d for d in digests]], check=True)
          subprocess.run(['docker', 'buildx', 'imagetools', 'inspect', tag], check=True)
          PY
